name: dbt docs

# Publishes the dbt docs site to GitHub Pages (DECISIONS.md #59, #66). Built in CI from the
# synthetic sample on a throwaway database, never from the owner's real data, and the build
# refuses to publish if any row in the warehouse is not synthetic.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: col_docs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docs -d col_docs"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql+psycopg2://docs:docs@localhost:5432/col_docs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tasks.py init-db
      - run: uv run python tasks.py load-sample
      - run: uv run python tasks.py dbt deps
      - run: uv run python tasks.py dbt build
      # The catalog holds names, types and descriptions, not rows, but the site must still be built
      # only from synthetic data. Every row counted by the data-health mart must be synthetic.
      - name: Only synthetic data reaches the site
        env:
          PGPASSWORD: docs
        run: |
          real=$(psql -h localhost -U docs -d col_docs -tAc \
            "select coalesce(sum(row_count - synthetic_row_count), -1) from marts.mart_data_health")
          echo "Non-synthetic rows: $real"
          test "$real" = "0"
      - run: uv run python tasks.py dbt docs generate --static
      - name: Assemble the site
        run: |
          mkdir _site
          cp dbt/target/static_index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
