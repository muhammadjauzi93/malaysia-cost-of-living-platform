# Streamlit reads this when `python tasks.py dashboard` starts it from the repo root.

[server]
# Without this, the first run stops at a prompt asking for an email address.
showEmailPrompt = false

[browser]
# Streamlit sends usage statistics by default. A local portfolio dashboard has no reason to.
gatherUsageStats = false

[client]
# Hide the developer menu (rerun, clear cache, settings) from someone viewing the dashboard.
toolbarMode = "viewer"

# Streamlit's bundled "financial dashboard" theme (DECISIONS.md #63), without its Google Fonts
# links: the dashboard makes no request to a third party, so it uses Streamlit's own font.
# charts.py uses the same colours for rises (red), falls (green) and the accent (blue).
[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#60A5FA", "#A78BFA", "#FBBF24", "#38BDF8", "#94A3B8", "#FB923C"]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#60A5FA"
