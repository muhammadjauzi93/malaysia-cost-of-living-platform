version: 2

# Intermediate models are the messy middle. Their tests check the joins and calculations
# themselves, so a mistake shows here rather than in a mart nobody can trace.

models:
  - name: int_fuel_monthly
    description: >
      National fuel price per fuel type per calendar month, weighted by the days each price was
      in effect (DECISIONS.md #46), with the month's low and high. A month with no announcement
      still has a price: the one carried forward from the last announcement.
      Grain: one row per (month_date, fuel_type).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_date, fuel_type]
      - dbt_utils.expression_is_true:
          name: int_fuel_monthly_average_within_range
          arguments:
            expression: "avg_price_myr between min_price_myr and max_price_myr"
    columns:
      - name: month_date
        description: "First day of the month."
        data_tests: [not_null]
      - name: fuel_type
        description: "Fuel type, as in staging."
        data_tests: [not_null]
      - name: avg_price_myr
        description: "Day-weighted mean of the prices in effect during the month, MYR per litre."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.50
                max_value: 10.00
      - name: min_price_myr
        description: "Lowest price in effect on any day of the month, MYR per litre."
        data_tests: [not_null]
      - name: max_price_myr
        description: "Highest price in effect on any day of the month, MYR per litre."
        data_tests: [not_null]
      - name: days_priced
        description: >
          Days of the month with a price in effect. A full month has all its days; the current
          month has the days up to today; a fuel's first or last month can have fewer.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 31
      - name: announcements_in_month
        description: "Announcements made in the month. Zero is normal when a price was held (September 2018)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 31

  - name: int_fuel_weekly_changes
    description: >
      Week-on-week change in each fuel price, measured against the previous announcement of the
      same fuel type. Grain: one row per (price_date, fuel_type), the same as stg_fuel_prices.
      The first row of each fuel type has no previous price, so its change is null.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_date, fuel_type]
    columns:
      - name: price_date
        description: "Date of the announcement."
        data_tests: [not_null]
      - name: fuel_type
        description: "Fuel type."
        data_tests: [not_null]
      - name: price_myr
        description: "Price on price_date, MYR per litre."
        data_tests: [not_null]
      - name: previous_price_date
        description: "Date of the previous announcement of the same fuel type; null for the first."
      - name: previous_price_myr
        description: "Price at the previous announcement; null for the first."
      - name: change_myr
        description: "price_myr minus previous_price_myr, MYR per litre."
        data_tests:
          - dbt_utils.accepted_range:
              name: int_fuel_weekly_changes_within_one_ringgit
              arguments:
                min_value: -1.00
                max_value: 1.00
              config:
                severity: warn
                where: "event_description is null"   # reviewed events: seeds/fuel_price_events.csv
      - name: event_description
        description: "The reviewed event for this announcement, from seeds/fuel_price_events.csv; null for ordinary weeks."
      - name: days_since_previous
        description: "Days between announcements. Normally 7; more means a missed week."
        data_tests:
          - dbt_utils.accepted_range:
              name: int_fuel_weekly_gap_at_most_two_weeks
              arguments:
                min_value: 1
                max_value: 14
              config:
                severity: warn
                where: "event_description is null"   # reviewed events: seeds/fuel_price_events.csv

  - name: int_cpi_state_monthly
    description: >
      One row per state and month with three indices as columns: overall, food (division 01) and
      transport (division 07). Grain: one row per (state_name, month_date). Other divisions remain
      in staging for later use.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [state_name, month_date]
    columns:
      - name: state_name
        description: "State or federal territory, as OpenDOSM names it."
        data_tests: [not_null]
      - name: month_date
        description: "First day of the month."
        data_tests: [not_null]
      - name: overall_cpi
        description: "All-items CPI, base 2010 = 100."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                max_value: 300
      - name: food_cpi
        description: "Food and non-alcoholic beverages (COICOP division 01), base 2010 = 100."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                max_value: 300
      - name: transport_cpi
        description: "Transport (COICOP division 07), base 2010 = 100. The index fuel prices should move."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 30
                max_value: 300

  - name: int_fx_monthly_myr
    description: >
      Monthly average mid exchange rate in ringgit per ONE unit of foreign currency, from one BNM
      session (1700 by default, set by the fx_session variable). Grain: one row per
      (currency_code, month_date).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, month_date]
    columns:
      - name: currency_code
        description: "ISO 4217 code."
        data_tests: [not_null]
      - name: month_date
        description: "First day of the month."
        data_tests: [not_null]
      - name: rate_myr_per_unit
        description: "Average mid rate in MYR for one unit of the currency (JPY already divided by 100)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.01
                max_value: 100
      - name: trading_days
        description: "Days with a published rate in the month."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 23

  - name: int_fuel_identical_runs
    description: >
      Runs of consecutive announcements in which two fuel types carry exactly the same price,
      with whether the run's first date has a reviewed event. Grain: one row per
      (fuel_a, fuel_b, run_start), where fuel_a sorts before fuel_b. Feeds the identical-price
      quality rule (DECISIONS.md #53).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [fuel_a, fuel_b, run_start]
    columns:
      - name: fuel_a
        description: "The first fuel of the pair, alphabetically."
        data_tests: [not_null]
      - name: fuel_b
        description: "The second fuel of the pair."
        data_tests: [not_null]
      - name: run_start
        description: "First announcement date of the run."
        data_tests: [not_null]
      - name: run_end
        description: "Last announcement date of the run."
        data_tests: [not_null]
      - name: announcements
        description: "Number of consecutive shared announcements with identical prices."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: run_start_reviewed
        description: >
          True when a reviewed event in fuel_price_events covers the run's first date for either
          fuel, or for every fuel. A reviewed run is accepted; an unreviewed one fails the rule.
        data_tests: [not_null]

# Unit tests: fixed input rows in, exact rows out, no database data needed. The cases are the real
# ones the first live run exposed (DECISIONS.md #46). "Today" is pinned so results never drift.
unit_tests:
  - name: int_fuel_monthly_month_without_announcement_carries_the_price
    description: >
      September 2018 had no announcement: RON95 was announced on 30 August and next on 1 October.
      Averaging announcements gave September no price. It must be RM2.20 on all 30 days.
    model: int_fuel_monthly
    overrides:
      macros:
        kl_today: "cast('2018-10-31' as date)"
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2018-08-30, fuel_type: ron95, price_myr: 2.20}
          - {price_date: 2018-10-01, fuel_type: ron95, price_myr: 2.20}
    expect:
      rows:
        - {month_date: 2018-08-01, fuel_type: ron95, avg_price_myr: 2.2000, days_priced: 2, announcements_in_month: 1}
        - {month_date: 2018-09-01, fuel_type: ron95, avg_price_myr: 2.2000, days_priced: 30, announcements_in_month: 0}
        - {month_date: 2018-10-01, fuel_type: ron95, avg_price_myr: 2.2000, days_priced: 31, announcements_in_month: 1}

  - name: int_fuel_monthly_weights_by_days_in_effect
    description: >
      June 2024 diesel: RM2.15 from 1 to 9 June, RM3.35 from 10 June. By days the month is
      (9 x 2.15 + 21 x 3.35) / 30 = 2.99. Averaging the five announcements would give 3.11.
    model: int_fuel_monthly
    overrides:
      macros:
        kl_today: "cast('2024-06-30' as date)"
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2024-05-30, fuel_type: diesel, price_myr: 2.15}
          - {price_date: 2024-06-06, fuel_type: diesel, price_myr: 2.15}
          - {price_date: 2024-06-10, fuel_type: diesel, price_myr: 3.35}
          - {price_date: 2024-06-13, fuel_type: diesel, price_myr: 3.35}
          - {price_date: 2024-06-20, fuel_type: diesel, price_myr: 3.35}
          - {price_date: 2024-06-27, fuel_type: diesel, price_myr: 3.35}
    expect:
      rows:
        - {month_date: 2024-05-01, fuel_type: diesel, avg_price_myr: 2.1500, min_price_myr: 2.15, max_price_myr: 2.15, days_priced: 2, announcements_in_month: 1}
        - {month_date: 2024-06-01, fuel_type: diesel, avg_price_myr: 2.9900, min_price_myr: 2.15, max_price_myr: 3.35, days_priced: 30, announcements_in_month: 5}

  - name: int_fuel_monthly_discontinued_fuel_stops_and_today_is_the_limit
    description: >
      A fuel last announced on 6 June while others continue is discontinued: its price runs
      only until the next announcement of any fuel (12 June), not to today. A fuel still being
      published runs to today (29 June), never into the future.
    model: int_fuel_monthly
    overrides:
      macros:
        kl_today: "cast('2024-06-29' as date)"
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2024-06-06, fuel_type: ron95, price_myr: 2.05}
          - {price_date: 2024-06-06, fuel_type: retired_scheme, price_myr: 1.50}
          - {price_date: 2024-06-13, fuel_type: ron95, price_myr: 2.05}
          - {price_date: 2024-06-20, fuel_type: ron95, price_myr: 2.05}
          - {price_date: 2024-06-27, fuel_type: ron95, price_myr: 2.05}
    expect:
      rows:
        - {month_date: 2024-06-01, fuel_type: ron95, days_priced: 24}
        - {month_date: 2024-06-01, fuel_type: retired_scheme, days_priced: 7}

  - name: int_fuel_weekly_changes_events_never_duplicate_rows
    description: >
      A date that matches both a fuel-specific event and an 'all' event must still give one row
      per announcement, with both descriptions joined.
    model: int_fuel_weekly_changes
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2024-06-06, fuel_type: diesel, price_myr: 2.15}
          - {price_date: 2024-06-10, fuel_type: diesel, price_myr: 3.35}
      - input: ref('fuel_price_events')
        rows:
          - {event_date: 2024-06-10, fuel_type: diesel, event_kind: price_shock, description: "diesel event"}
          - {event_date: 2024-06-10, fuel_type: all, event_kind: schedule_change, description: "all-fuel event"}
    expect:
      rows:
        - {price_date: 2024-06-06, fuel_type: diesel, change_myr: null, event_description: null}
        - {price_date: 2024-06-10, fuel_type: diesel, change_myr: 1.20, event_description: "all-fuel event; diesel event"}

  - name: identical_runs_breaks
    description: >
      Two identical stretches separated by a different price are two runs, and a pair that matches
      once is a run of one. A run is excused only when its first date is reviewed.
    model: int_fuel_identical_runs
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2026-10-01, fuel_type: diesel, price_myr: 4.00}
          - {price_date: 2026-10-01, fuel_type: diesel_eastmsia, price_myr: 4.00}
          - {price_date: 2026-10-08, fuel_type: diesel, price_myr: 4.00}
          - {price_date: 2026-10-08, fuel_type: diesel_eastmsia, price_myr: 4.10}
          - {price_date: 2026-10-15, fuel_type: diesel, price_myr: 4.00}
          - {price_date: 2026-10-15, fuel_type: diesel_eastmsia, price_myr: 4.00}
          - {price_date: 2026-10-01, fuel_type: ron95, price_myr: 9.00}
          - {price_date: 2026-10-01, fuel_type: ron97, price_myr: 9.00}
      - input: ref('fuel_price_events')
        rows:
          - {event_date: 2018-06-07, fuel_type: all, event_kind: schedule_change, description: "unrelated"}
    expect:
      rows:
        - {fuel_a: diesel, fuel_b: diesel_eastmsia, run_start: 2026-10-01, run_end: 2026-10-01, announcements: 1, run_start_reviewed: false}
        - {fuel_a: diesel, fuel_b: diesel_eastmsia, run_start: 2026-10-15, run_end: 2026-10-15, announcements: 1, run_start_reviewed: false}
        - {fuel_a: ron95, fuel_b: ron97, run_start: 2026-10-01, run_end: 2026-10-01, announcements: 1, run_start_reviewed: false}

  - name: identical_runs_reviewed_start_2018
    description: >
      The 2018 freeze is a run of identical diesel prices that starts on a reviewed date, so it is
      accepted; the 2026 copy starts on an unreviewed date, so it is not.
    model: int_fuel_identical_runs
    given:
      - input: ref('stg_fuel_prices')
        rows:
          - {price_date: 2018-06-07, fuel_type: diesel, price_myr: 2.18}
          - {price_date: 2018-06-07, fuel_type: diesel_eastmsia, price_myr: 2.18}
          - {price_date: 2018-10-01, fuel_type: diesel, price_myr: 2.18}
          - {price_date: 2018-10-01, fuel_type: diesel_eastmsia, price_myr: 2.18}
          - {price_date: 2018-11-01, fuel_type: diesel, price_myr: 2.18}
          - {price_date: 2018-11-01, fuel_type: diesel_eastmsia, price_myr: 2.18}
          - {price_date: 2019-06-06, fuel_type: diesel, price_myr: 2.20}
          - {price_date: 2019-06-06, fuel_type: diesel_eastmsia, price_myr: 2.25}
          - {price_date: 2026-10-01, fuel_type: diesel, price_myr: 5.27}
          - {price_date: 2026-10-01, fuel_type: diesel_eastmsia, price_myr: 5.27}
          - {price_date: 2026-10-08, fuel_type: diesel, price_myr: 5.27}
          - {price_date: 2026-10-08, fuel_type: diesel_eastmsia, price_myr: 5.27}
          - {price_date: 2026-10-15, fuel_type: diesel, price_myr: 5.17}
          - {price_date: 2026-10-15, fuel_type: diesel_eastmsia, price_myr: 5.17}
      - input: ref('fuel_price_events')
        rows:
          - {event_date: 2018-06-07, fuel_type: all, event_kind: schedule_change, description: "frozen schedule"}
    expect:
      rows:
        - {fuel_a: diesel, fuel_b: diesel_eastmsia, run_start: 2018-06-07, run_end: 2018-11-01, announcements: 3, run_start_reviewed: true}
        - {fuel_a: diesel, fuel_b: diesel_eastmsia, run_start: 2026-10-01, run_end: 2026-10-15, announcements: 3, run_start_reviewed: false}
