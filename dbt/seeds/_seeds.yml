version: 2

seeds:
  - name: state_reference
    description: >
      The sixteen states and federal territories as OpenDOSM names them, with ISO 3166-2:MY codes
      and region. Grain: one row per state. A CPI state missing from this list fails the
      relationship tests on the marts, which is how a renamed state is caught.
    columns:
      - name: state_name
        description: "Name exactly as in the CPI source."
        data_tests: [unique, not_null]
      - name: state_code
        description: "ISO 3166-2:MY code, e.g. MY-14 for W.P. Kuala Lumpur."
        data_tests: [unique, not_null]
      - name: region
        description: "Peninsular or East Malaysia (Sabah, Sarawak, Labuan)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Peninsular, East Malaysia]

  - name: cpi_division_reference
    description: >
      COICOP 2018 division names for codes 01 to 13, plus 'overall'. Grain: one row per division.
      Names follow COICOP 2018; check them against OpenDOSM's labels before publishing.
    columns:
      - name: division_code
        description: "Two-digit code as text, or 'overall'."
        data_tests: [unique, not_null]
      - name: division_name
        description: "Division name."
        data_tests: [not_null]

  - name: currency_reference
    description: "The five currencies the pipeline tracks. Grain: one row per currency."
    columns:
      - name: currency_code
        description: "ISO 4217 code."
        data_tests: [unique, not_null]
      - name: currency_name
        description: "Common English name."
        data_tests: [not_null]

  - name: fuel_price_events
    description: >
      Reviewed, real events in the fuel price series, found when warning tests fired on real data.
      Grain: one row per (event_date, fuel_type); fuel_type 'all' means every fuel type that day.
      Rows listed here are excluded from the "unusual change" and "long gap" warning tests, so
      those tests only fire for something NEW. The descriptions also annotate the dashboard.
      Add a row only after looking at the data; never to silence a warning you have not understood.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [event_date, fuel_type]
    columns:
      - name: event_date
        description: "The price_date of the announcement the event refers to."
        data_tests: [not_null]
      - name: fuel_type
        description: "A fuel type, or 'all' for every fuel type on that date."
        data_tests: [not_null]
      - name: event_kind
        description: "price_shock (a large change) or schedule_change (announcements irregular)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [price_shock, schedule_change]
      - name: description
        description: "What the data shows, in one line. Facts from the data, not background claims."
        data_tests: [not_null]
