[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "col-pipeline"
version = "0.1.0"
description = "Malaysia Cost-of-Living Data Platform: ingestion and orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "dagster>=1.13.26",
    "dagster-webserver>=1.13.26",
    "dagster-dbt>=0.29.26",
    # Dagster pulls this in, and its newest release (1.85) is generated against protobuf 7, which
    # the rest of the stack does not use yet. Plain pip took it and the test suite failed to import
    # (see DECISIONS.md #54). The lock already pins 1.81.1, so this only makes pip agree with it.
    "grpcio-health-checking>=1.81.1,<1.82",
]

[project.scripts]
# Installs a `col-pipeline` command into the venv on every OS (col-pipeline.exe on Windows).
col-pipeline = "col_pipeline.cli:main"

[dependency-groups]
# PEP 735 groups. `uv sync` installs the groups named in [tool.uv] default-groups below;
# pip >= 25.1 uses `--group dev --group dbt`. tasks.py setup --pip reads both from here.
dbt = [
    "dbt-core>=1.10.6,<1.13",
    "dbt-postgres>=1.9,<2",
]
dev = [
    "croniter>=6.2.4",
    "pytest>=8.0",
    "pyyaml>=6",
    "ruff>=0.5",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.dagster]
module_name = "col_pipeline.orchestration.definitions"
code_location_name = "cost_of_living"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live Postgres (set TEST_DB_URL)"]
